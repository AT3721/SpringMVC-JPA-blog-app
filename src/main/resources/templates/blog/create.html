<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Viết Bài Mới</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px 100px; }
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input[type="text"], textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>

<h2>VIẾT BÀI BLOG MỚI</h2>

<form th:action="@{/blogs/create}" th:object="${blog}" method="post">
    <div class="form-group">
        <label>Tiêu đề:</label>
        <input type="text" th:field="*{title}" required />
    </div>
    <div class="form-group">
        <label>Tác giả:</label>
        <input type="text" th:field="*{author}" required />
    </div>
    <div class="form-group">
        <label>Tóm tắt ngắn:</label>
        <input type="text" th:field="*{summary}" required />
    </div>
    <div class="form-group">
        <label>Nội dung chi tiết:</label>
        <textarea th:field="*{content}" rows="8" required></textarea>
    </div>
    <button type="submit">Lưu bài viết</button>
    <a th:href="@{/blogs}">Hủy</a>
</form>

</body>
</html>
