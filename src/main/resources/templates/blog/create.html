<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài viết mới</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container" style="max-width: 640px;">
    <h2 style="margin-bottom: 24px; font-weight: 700;">Viết bài mới</h2>

    <form th:action="@{/blogs/create}" th:object="${blog}" method="post" style="display: flex; flex-direction: column; gap: 20px;">
        <div>
            <label style="display: block; margin-bottom: 8px; font-size: 0.9rem; color: var(--text-secondary);">Tiêu đề</label>
            <input type="text" th:field="*{title}" required />
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div>
                <label style="display: block; margin-bottom: 8px; font-size: 0.9rem; color: var(--text-secondary);">Tác giả</label>
                <input type="text" th:field="*{author}" required />
            </div>
            <div>
                <label style="display: block; margin-bottom: 8px; font-size: 0.9rem; color: var(--text-secondary);">Danh mục</label>
                <select th:field="*{category}">
                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                </select>
            </div>
        </div>

        <div>
            <label style="display: block; margin-bottom: 8px; font-size: 0.9rem; color: var(--text-secondary);">Tóm tắt ngắn</label>
            <input type="text" th:field="*{summary}" required />
        </div>

        <div>
            <label style="display: block; margin-bottom: 8px; font-size: 0.9rem; color: var(--text-secondary);">Nội dung bài viết</label>
            <textarea th:field="*{content}" rows="10" required></textarea>
        </div>

        <div style="display: flex; gap: 12px; margin-top: 10px;">
            <button type="submit" class="btn btn-primary">Xuất bản bài viết</button>
            <a th:href="@{/blogs}" class="btn btn-secondary">Hủy</a>
        </div>
    </form>
</div>

</body>
</html>
