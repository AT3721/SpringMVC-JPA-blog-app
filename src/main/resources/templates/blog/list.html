<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">
    <header>
        <div class="nav-bar">
            <a th:href="@{/blogs}" class="nav-brand">
    <span class="brand-text">Thoughts</span><span class="brand-dot"></span>
</a>
            <a th:href="@{/blogs/create}" class="btn btn-primary">+ Viết bài</a>
        </div>

        <div class="categories-bar">
            <a th:href="@{/blogs}" class="cat-link" th:classappend="${selectedCategory == null} ? 'active'">Tất cả</a>
            <a th:each="cat : ${categories}"
               th:href="@{/blogs/category/{id}(id=${cat.id})}"
               th:text="${cat.name}"
               class="cat-link"
               th:classappend="${selectedCategory != null and selectedCategory.id == cat.id} ? 'active'"></a>
            <a th:href="@{/categories}" class="cat-link" style="margin-left: auto;">Quản lý danh mục →</a>
        </div>
    </header>

    <!-- Search Form -->
    <form th:action="@{/blogs}" method="get" class="search-form">
        <div class="search-input-wrapper">
            <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text"
                   name="search"
                   th:value="${search}"
                   placeholder="Tìm kiếm bài viết theo tiêu đề..."
                   autocomplete="off" />
            <button type="submit" class="btn-search-submit">Tìm</button>
        </div>
    </form>

    <!-- Blog Feed -->
    <div class="blog-list">
        <article class="blog-card" th:each="b : ${blogs}">
            <div class="blog-meta">
                <span th:text="${b.category != null ? b.category.name : 'Chưa phân loại'}"></span>
                <span>•</span>
                <span th:text="${#temporals.format(b.createdAt, 'dd MMM, yyyy')}"></span>
            </div>
            <h2 class="blog-title">
                <a th:href="@{/blogs/{id}(id=${b.id})}" th:text="${b.title}"></a>
            </h2>
            <p class="blog-summary" th:text="${b.summary}"></p>
            <div class="blog-actions">
                <a th:href="@{/blogs/{id}(id=${b.id})}" class="btn btn-secondary">Đọc tiếp</a>
                <a th:href="@{/blogs/{id}/edit(id=${b.id})}" class="btn btn-secondary">Sửa</a>
                <a th:href="@{/blogs/{id}/delete(id=${b.id})}" onclick="return confirm('Xóa bài này?')" class="btn btn-danger">Xóa</a>
            </div>
        </article>
    </div>

    <!-- Pagination -->
    <div class="pagination" th:if="${blogs.totalPages > 1}">
        <a th:if="${blogs.hasPrevious()}" th:href="@{/blogs(page=${blogs.number - 1}, search=${search})}" class="btn btn-secondary">← Trang trước</a>
        <span style="color: var(--text-secondary);" th:text="${blogs.number + 1} + ' / ' + ${blogs.totalPages}"></span>
        <a th:if="${blogs.hasNext()}" th:href="@{/blogs(page=${blogs.number + 1}, search=${search})}" class="btn btn-secondary">Trang sau →</a>
    </div>
</div>

</body>
</html>
