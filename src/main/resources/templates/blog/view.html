<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${blog.title}"></title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container" style="max-width: 680px;">
    <a th:href="@{/blogs}" class="btn btn-secondary" style="margin-bottom: 30px;">← Tác phẩm khác</a>

    <article>
        <div class="article-header">
            <div class="blog-meta" style="margin-bottom: 12px;">
                <span th:text="${blog.category != null ? blog.category.name : 'Chưa phân loại'}"></span>
                <span>•</span>
                <span th:text="${#temporals.format(blog.createdAt, 'dd MMMM, yyyy')}"></span>
                <span>•</span>
                <span th:text="'Bởi ' + ${blog.author}"></span>
            </div>
            <h1 class="article-title" th:text="${blog.title}"></h1>
        </div>

        <div class="article-content" th:text="${blog.content}"></div>
    </article>
</div>

</body>
</html>
