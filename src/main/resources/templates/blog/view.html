<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${blog.title}"></title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px 120px; line-height: 1.6; }
        .meta { color: #666; font-size: 14px; border-bottom: 1px solid #ccc; padding-bottom: 10px; }
        .content { margin-top: 20px; white-space: pre-wrap; }
    </style>
</head>
<body>

<h1 th:text="${blog.title}"></h1>
<div class="meta">
    Tác giả: <strong th:text="${blog.author}"></strong> |
    Đăng lúc: <span th:text="${#temporals.format(blog.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
</div>

<p><strong>Tóm tắt:</strong> <em th:text="${blog.summary}"></em></p>
<hr/>

<div class="content" th:text="${blog.content}"></div>

<br/><br/>
<a th:href="@{/blogs}">← Quay lại danh sách</a>
</body>
</html>
