<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm Danh mục mới</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container" style="max-width: 520px;">
    <h2 style="margin-bottom: 24px; font-weight: 700;">Thêm Danh mục mới</h2>

    <form th:action="@{/categories/create}" th:object="${category}" method="post" style="display: flex; flex-direction: column; gap: 20px;">
        <div>
            <label style="display: block; margin-bottom: 8px; font-size: 0.9rem; color: var(--text-secondary);">Tên danh mục</label>
            <input type="text" th:field="*{name}" placeholder="Ví dụ: Công nghệ, Lập trình..." required />
        </div>

        <div style="display: flex; gap: 12px; margin-top: 10px;">
            <button type="submit" class="btn btn-primary">Lưu danh mục</button>
            <a th:href="@{/categories}" class="btn btn-secondary">Hủy</a>
        </div>
    </form>
</div>

</body>
</html>
